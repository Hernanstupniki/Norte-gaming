name: CI/CD

on:
  push:
    branches:
      - main
      - nuevabranch
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  quality-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Test backend
        working-directory: ./backend
        run: npm run test

      - name: Build backend
        working-directory: ./backend
        run: npm run build

  quality-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/nuevabranch'
    needs:
      - quality-backend
      - quality-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BACKEND API ---
      - name: Check if Backend API immutable SHA tag exists
        id: check-api-sha
        run: |
          if docker buildx imagetools inspect "${REGISTRY}/hernanstupniki/norte-gaming-api:sha-${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "==> Backend API tag sha-${GITHUB_SHA} already exists in GHCR."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "==> Backend API tag sha-${GITHUB_SHA} not found in GHCR."
          fi

      - name: Build and push Backend API Image
        if: steps.check-api-sha.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/hernanstupniki/norte-gaming-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Promote Backend API SHA image to latest
        run: |
          echo "==> Promoting Backend API sha-${GITHUB_SHA} to latest..."
          docker buildx imagetools create \
            --tag "${REGISTRY}/hernanstupniki/norte-gaming-api:latest" \
            "${REGISTRY}/hernanstupniki/norte-gaming-api:sha-${GITHUB_SHA}"

      # --- FRONTEND WEB ---
      - name: Check if Frontend Web immutable SHA tag exists
        id: check-web-sha
        run: |
          if docker buildx imagetools inspect "${REGISTRY}/hernanstupniki/norte-gaming-web:sha-${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "==> Frontend Web tag sha-${GITHUB_SHA} already exists in GHCR."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "==> Frontend Web tag sha-${GITHUB_SHA} not found in GHCR."
          fi

      - name: Build and push Frontend Web Image
        if: steps.check-web-sha.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://nortegaming.com/api
          push: true
          tags: ${{ env.REGISTRY }}/hernanstupniki/norte-gaming-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Promote Frontend Web SHA image to latest
        run: |
          echo "==> Promoting Frontend Web sha-${GITHUB_SHA} to latest..."
          docker buildx imagetools create \
            --tag "${REGISTRY}/hernanstupniki/norte-gaming-web:latest" \
            "${REGISTRY}/hernanstupniki/norte-gaming-web:sha-${GITHUB_SHA}"

      - name: Verify immutable images
        run: |
          docker buildx imagetools inspect "${REGISTRY}/hernanstupniki/norte-gaming-api:sha-${GITHUB_SHA}" >/dev/null
          docker buildx imagetools inspect "${REGISTRY}/hernanstupniki/norte-gaming-api:latest" >/dev/null
          docker buildx imagetools inspect "${REGISTRY}/hernanstupniki/norte-gaming-web:sha-${GITHUB_SHA}" >/dev/null
          docker buildx imagetools inspect "${REGISTRY}/hernanstupniki/norte-gaming-web:latest" >/dev/null

  deploy:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/nuevabranch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Dokploy Webhook
        shell: bash
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PYWEBHOOK'
          import json, os, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          url = os.environ.get("DOKPLOY_WEBHOOK_URL", "").strip()
          if not url:
              print("Missing repository Secret DOKPLOY_WEBHOOK_URL")
              raise SystemExit(1)
          try:
              request = urllib.request.Request(url,
                  data=json.dumps({"ref": os.environ["GITHUB_REF"]}).encode(),
                  headers={"Content-Type": "application/json", "x-github-event": "push"}, method="POST")
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=60) as response:
                  body = response.read(4097)
                  if response.status != 200 or len(body) > 4096:
                      raise ValueError("Unexpected response")
                  payload = json.loads(body)
                  if not isinstance(payload, dict) or payload.get("message") != "Compose deployed successfully":
                      raise ValueError("Unexpected response")
          except Exception:
              print("Webhook failed or acceptance is unknown. Check Dokploy before retrying.")
              raise SystemExit(1)
          print("Dokploy accepted the request. Verify deployment completion separately.")
          PYWEBHOOK

