name: CI/CD

on:
  push:
    branches:
      - main
      - nuevabranch
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  quality-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Test backend
        working-directory: ./backend
        run: npm run test

      - name: Build backend
        working-directory: ./backend
        run: npm run build

  quality-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/nuevabranch'
    needs:
      - quality-backend
      - quality-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BACKEND API ---
      - name: Check if Backend API immutable SHA tag exists
        id: check-api-sha
        run: |
          if docker buildx imagetools inspect "${REGISTRY}/hernanstupniki/norte-gaming-api:sha-${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "==> Backend API tag sha-${GITHUB_SHA} already exists in GHCR."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "==> Backend API tag sha-${GITHUB_SHA} not found in GHCR."
          fi

      - name: Build and push Backend API Image
        if: steps.check-api-sha.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/hernanstupniki/norte-gaming-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Promote Backend API SHA image to latest
        run: |
          echo "==> Promoting Backend API sha-${GITHUB_SHA} to latest..."
          docker buildx imagetools create \
            --tag "${REGISTRY}/hernanstupniki/norte-gaming-api:latest" \
            "${REGISTRY}/hernanstupniki/norte-gaming-api:sha-${GITHUB_SHA}"

      # --- FRONTEND WEB ---
      - name: Check if Frontend Web immutable SHA tag exists
        id: check-web-sha
        run: |
          if docker buildx imagetools inspect "${REGISTRY}/hernanstupniki/norte-gaming-web:sha-${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "==> Frontend Web tag sha-${GITHUB_SHA} already exists in GHCR."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "==> Frontend Web tag sha-${GITHUB_SHA} not found in GHCR."
          fi

      - name: Build and push Frontend Web Image
        if: steps.check-web-sha.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://nortegaming.com/api
          push: true
          tags: ${{ env.REGISTRY }}/hernanstupniki/norte-gaming-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Promote Frontend Web SHA image to latest
        run: |
          echo "==> Promoting Frontend Web sha-${GITHUB_SHA} to latest..."
          docker buildx imagetools create \
            --tag "${REGISTRY}/hernanstupniki/norte-gaming-web:latest" \
            "${REGISTRY}/hernanstupniki/norte-gaming-web:sha-${GITHUB_SHA}"

      - name: Verify immutable images
        run: |
          docker buildx imagetools inspect "${REGISTRY}/hernanstupniki/norte-gaming-api:sha-${GITHUB_SHA}" >/dev/null
          docker buildx imagetools inspect "${REGISTRY}/hernanstupniki/norte-gaming-api:latest" >/dev/null
          docker buildx imagetools inspect "${REGISTRY}/hernanstupniki/norte-gaming-web:sha-${GITHUB_SHA}" >/dev/null
          docker buildx imagetools inspect "${REGISTRY}/hernanstupniki/norte-gaming-web:latest" >/dev/null

  deploy:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/nuevabranch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Dokploy Webhook
        run: |
          echo "==> Triggering Dokploy deployment webhook..."
          curl --fail-with-body --show-error --silent \
            --connect-timeout 10 --max-time 300 --retry 3 \
            -H "Content-Type: application/json" \
            -H "x-github-event: push" \
            -d '{"ref":"${{ github.ref }}"}' \
            -X POST "http://72.62.15.178:3000/api/deploy/compose/wo77pwWKuA1Jmek5jH55L"
          echo ""
          echo "==> Dokploy deployment triggered successfully."
